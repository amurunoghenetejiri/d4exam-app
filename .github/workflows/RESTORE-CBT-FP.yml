name: RESTORE-CBT-FP
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/RESTORE-CBT-FP.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          # Known-good parent before PLACEHOLDER
          if git cat-file -e 94a3c985580a54853696843f7b20a036eca8d60d^{commit} 2>/dev/null; then
            git show 94a3c985580a54853696843f7b20a036eca8d60d:src/components/cbt/CbtExamSession.impl.tsx > src/components/cbt/CbtExamSession.impl.tsx
          else
            # Fallback: download from raw at that commit via githubusercontent
            curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-platform/94a3c985580a54853696843f7b20a036eca8d60d/src/components/cbt/CbtExamSession.impl.tsx" -o src/components/cbt/CbtExamSession.impl.tsx
          fi
          wc -c src/components/cbt/CbtExamSession.impl.tsx
          head -1 src/components/cbt/CbtExamSession.impl.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/cbt/CbtExamSession.impl.tsx")
          text = p.read_text()
          if text.strip() == "PLACEHOLDER" or len(text) < 1000:
              raise SystemExit("still placeholder or too small")
          old_imp = 'import { isExamAttemptFinished } from "@/lib/student";'
          new_imp = old_imp + "\nimport { setExamActiveFlag } from \"@/lib/fingerprint-lock\";"
          if "setExamActiveFlag" not in text:
              if old_imp not in text:
                  raise SystemExit("import anchor missing")
              text = text.replace(old_imp, new_imp, 1)
          needle = "}, [done, shutdownMedia]);"
          flag_block = '''}, [done, shutdownMedia]);\n\n  /** Keep fingerprint app-lock from interrupting an active CBT session */\n  useEffect(() => {\n    const active = Boolean(started && !done && !previewMode);\n    setExamActiveFlag(active);\n    return () => setExamActiveFlag(false);\n  }, [started, done, previewMode]);'''
          if "setExamActiveFlag(active)" not in text:
              if needle not in text:
                  raise SystemExit("needle missing")
              text = text.replace(needle, flag_block, 1)
          p.write_text(text)
          print("ok", len(text), text.count("setExamActiveFlag"))
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.app"
          git add src/components/cbt/CbtExamSession.impl.tsx
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(cbt): restore session + mark exam active for fingerprint lock skip"
          git push origin HEAD:main
