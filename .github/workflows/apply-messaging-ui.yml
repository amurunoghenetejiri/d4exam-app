name: Apply messaging UI patches
on:
  workflow_dispatch:
  push:
    paths:
      - "patches/mm-seek.patch"
      - "patches/co-ui-fix.patch"
      - ".github/workflows/apply-messaging-ui.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -euo pipefail
          patch -p1 < patches/mm-seek.patch
          patch -p1 < patches/co-ui-fix.patch
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/components/messaging/MessageMedia.tsx src/routes/student.contact-officer.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Messaging UI: wave seek, list polish, navy chrome, menu z-index"
          git push
