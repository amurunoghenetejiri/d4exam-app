name: Messaging UX fix
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/msg-ux-mini.py"
      - ".github/workflows/msg-ux-fix.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX fixes
        run: |
          set -euo pipefail
          python3 scripts/msg-ux-mini.py
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(messaging): voice duration, blue recorder, bigger mic, visible back/rename, silent offline, hide offline pill"
          git push
