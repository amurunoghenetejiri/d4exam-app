name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # Runner already has Android SDK. Do NOT install obsolete package "tools".
      - name: Accept Android licenses & ensure platform/build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || true

      - name: Install JS deps
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile || bun install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Write client env for build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "WARNING: VITE_SUPABASE_* secrets not set"
          fi
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
          } > .env

      - name: Ensure no website server.url in Capacitor configs
        run: |
          if grep -RInE '"url"\s*:\s*"https?://[^"]*d4exam|"url"\s*:\s*"https?://[^"]*vercel' capacitor.config.ts capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "FATAL: website server.url still present"
            exit 1
          fi
          echo "OK: no website server.url in Capacitor configs"

      - name: Build Capacitor SPA shell
        run: npm run build:app

      - name: Cap sync Android
        run: npx cap sync android

      - name: Re-assert no website server.url after sync
        run: |
          if grep -RInE '"url"\s*:\s*"https?://' android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "FATAL: server.url reintroduced by cap sync"
            cat android/app/src/main/assets/capacitor.config.json
            exit 1
          fi

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
