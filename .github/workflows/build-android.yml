name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK platforms & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" || true
          # Fallback if 36 build-tools name differs
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Install JS deps
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile || bun install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Write client env for build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
          } > .env

      - name: Ensure no website server.url
        run: |
          if grep -RInE '"url"\s*:\s*"https?://[^"]*d4exam|"url"\s*:\s*"https?://[^"]*vercel' capacitor.config.ts capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "FATAL: website server.url still present"
            exit 1
          fi

      - name: Build Capacitor SPA shell
        run: npm run build:app

      - name: Cap sync Android
        run: npx cap sync android

      - name: Re-assert no website server.url after sync
        run: |
          if grep -RInE '"url"\s*:\s*"https?://' android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "FATAL: server.url reintroduced by cap sync"
            cat android/app/src/main/assets/capacitor.config.json
            exit 1
          fi

      - name: Bootstrap Gradle wrapper if missing
        working-directory: android
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; exit 0; fi
          GRADLE_VER=8.14.3
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version "${GRADLE_VER}"
          chmod +x gradlew

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
