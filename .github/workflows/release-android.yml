name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android licenses & platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install JS deps
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile || bun install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Write client env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}"
          } > .env

      - name: Build SPA + sync + APK
        run: |
          npm run build:app
          npx cap sync android
          if grep -RInE '"url"\s*:\s*"https?://' android/app/src/main/assets/capacitor.config.json 2>/dev/null; then
            echo "FATAL: website server.url present after sync"
            exit 1
          fi
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.0.0-$(date +%Y%m%d%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p release-out
          cp android/app/build/outputs/apk/debug/*.apk "release-out/d4exam-${TAG}.apk" 2>/dev/null || \
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-out/d4exam-${TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: d4exam-release-apk
          path: release-out/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
