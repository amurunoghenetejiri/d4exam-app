name: FIX-ACCOUNT-SWITCH
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/FIX-ACCOUNT-SWITCH.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Harden switchToAccount
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/lib/account-switcher.ts")
          t = p.read_text()
          if "Prefer setSession first" in t:
              print("already hardened")
          else:
              old_h = "          apikey: key,\n          Authorization: `Bearer ${key}`,"
              new_h = (
                  "          apikey: key,\n"
                  "          ...(key.startsWith(\"sb_publishable_\") || key.startsWith(\"sb_secret_\")\n"
                  "            ? {}\n"
                  "            : { Authorization: `Bearer ${key}` }),"
              )
              if old_h in t:
                  t = t.replace(old_h, new_h)
                  print("headers patched")
              old_o = (
                  "  try {\n"
                  "    try {\n"
                  '      await supabase.auth.signOut({ scope: "local" });\n'
                  "    } catch {\n"
                  "      /* ignore */\n"
                  "    }\n"
                  "    await new Promise((r) => setTimeout(r, 80));\n"
                  "\n"
                  "    if (refreshTok) {\n"
                  "      const api = await refreshViaApi(refreshTok);"
              )
              new_o = (
                  "  try {\n"
                  "    // Prefer setSession first so current account is preserved if switch fails\n"
                  "    if (accessTok && refreshTok) {\n"
                  "      const ok = await commitSession(accessTok, refreshTok, targetId);\n"
                  "      if (ok) {\n"
                  "        if (account.role) seedPendingLoginRole(account.role);\n"
                  '        if (typeof window !== "undefined") window.location.replace(path);\n'
                  "        return { ok: true };\n"
                  "      }\n"
                  "    }\n"
                  "\n"
                  "    if (refreshTok) {\n"
                  "      const api = await refreshViaApi(refreshTok);\n"
                  "      if (api && (!api.uid || api.uid === targetId)) {\n"
                  "        const ok = await commitSession(api.access, api.refresh, targetId);\n"
                  "        if (ok) {\n"
                  "          if (account.role) seedPendingLoginRole(account.role);\n"
                  '          if (typeof window !== "undefined") window.location.replace(path);\n'
                  "          return { ok: true };\n"
                  "        }\n"
                  "      }\n"
                  "    }\n"
                  "\n"
                  "    try {\n"
                  '      await supabase.auth.signOut({ scope: "local" });\n'
                  "    } catch {\n"
                  "      /* ignore */\n"
                  "    }\n"
                  "    await new Promise((r) => setTimeout(r, 60));\n"
                  "\n"
                  "    if (refreshTok) {\n"
                  "      const api = await refreshViaApi(refreshTok);"
              )
              if old_o in t:
                  t = t.replace(old_o, new_o)
                  print("order patched")
              else:
                  print("WARN order not found")
              t = t.replace(
                  '"Could not switch to that account. Sign in once more to refresh it on this device."',
                  '"Session for that account expired on this device. Sign in once to refresh it."',
              )
              p.write_text(t)
              print("written", len(t))
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/lib/account-switcher.ts
          git status --short
          git commit -m "fix(accounts): harden switch token order and API headers" || echo nochange
          git push origin HEAD:main
