name: Restore messaging page
on:
  workflow_dispatch:
  push:
    paths:
      - "patches/co-navy-menu.patch"
      - ".github/workflows/restore-messaging.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good contact-officer and apply navy/menu patch
        run: |
          set -euo pipefail
          git show fcc7193f980d8392846f52806535aa48f55e90bf:src/routes/student.contact-officer.tsx > src/routes/student.contact-officer.tsx
          if [ -f patches/co-navy-menu.patch ]; then
            patch -p1 --fuzz=3 -f < patches/co-navy-menu.patch || true
          fi
          python3 - <<'PY'
from pathlib import Path
p = Path("src/routes/student.contact-officer.tsx")
t = p.read_text()
t = t.replace(
  'className="relative z-10 shrink-0 border-t bg-white px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]"',
  'className="relative z-10 shrink-0 border-t border-white/10 bg-[#0b1b3a] px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] text-white"',
)
if "z-[70]" not in t and "chatMenuOpen" in t:
    t = t.replace(
      'className="absolute right-0 z-20 mt-1 w-48 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg"',
      'className="absolute right-0 z-[70] mt-1 w-48 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-xl"',
    )
p.write_text(t)
print("navy/menu checks:", "0b1b3a" in t, "z-[70]" in t, "PLACEHOLDER" not in t)
PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.local"
          git add src/routes/student.contact-officer.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(messaging): restore contact-officer + navy chrome + menu z-70 outside close"
          git push
