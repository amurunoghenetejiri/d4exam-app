name: Restore messaging page
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navy chrome and menu fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
p = Path("src/routes/student.contact-officer.tsx")
t = p.read_text()
if "PLACEHOLDER" in t or len(t) < 1000:
    import subprocess
    subprocess.check_call(["git", "show", "fcc7193f980d8392846f52806535aa48f55e90bf:src/routes/student.contact-officer.tsx"], stdout=open(p, "w"))
    t = p.read_text()
t = t.replace(
  'className="grid h-9 w-9 place-items-center rounded-full hover:bg-slate-100 lg:hidden"',
  'className="grid h-9 w-9 place-items-center rounded-full text-white hover:bg-white/10 lg:hidden"',
)
t = t.replace(
  'officerOnline ? "text-emerald-600" : "text-slate-400"',
  'officerOnline ? "text-emerald-400" : "text-white/60"',
)
t = t.replace(
  'className="grid h-9 w-9 place-items-center rounded-full text-slate-500 hover:bg-slate-100" onClick={() => setChatMenuOpen((v) => !v)}',
  'className="grid h-9 w-9 place-items-center rounded-full text-white hover:bg-white/10" onClick={() => setChatMenuOpen((v) => !v)}',
)
old_menu = '''          {chatMenuOpen ? (
            <div className="absolute right-0 z-20 mt-1 w-48 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-lg">
              <button type="button" className="block w-full px-3 py-2.5 text-left text-sm hover:bg-slate-50" onClick={() => { setRenameVal(officerNickname); setRenameOpen(true); setChatMenuOpen(false); }}>Rename</button>
              <button type="button" className="block w-full px-3 py-2.5 text-left text-sm text-red-600 hover:bg-red-50" onClick={() => { setClearOpen(true); setChatMenuOpen(false); }}>Clear chat</button>
            </div>
          ) : null}'''
new_menu = '''          {chatMenuOpen ? (
            <>
              <button type="button" className="fixed inset-0 z-[69]" aria-label="Close menu" onClick={() => setChatMenuOpen(false)} />
              <div className="absolute right-0 z-[70] mt-1 w-48 overflow-hidden rounded-xl border border-slate-200 bg-white py-1 shadow-xl">
                <button type="button" className="block w-full px-3 py-2.5 text-left text-sm text-slate-800 hover:bg-slate-50" onClick={() => { setRenameVal(officerNickname); setRenameOpen(true); setChatMenuOpen(false); }}>Rename</button>
                <button type="button" className="block w-full px-3 py-2.5 text-left text-sm text-red-600 hover:bg-red-50" onClick={() => { setClearOpen(true); setChatMenuOpen(false); }}>Clear chat</button>
              </div>
            </>
          ) : null}'''
if old_menu in t:
    t = t.replace(old_menu, new_menu)
t = t.replace(
  'className="relative z-10 shrink-0 border-t bg-white px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]"',
  'className="relative z-10 shrink-0 border-t border-white/10 bg-[#0b1b3a] px-2 py-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] text-white"',
)
t = t.replace(
  'className="mb-1 grid h-9 w-9 place-items-center rounded-full text-slate-500" onClick={() => fileRef.current?.click()} aria-label="Attach file"',
  'className="mb-1 grid h-9 w-9 place-items-center rounded-full text-white/80 hover:bg-white/10" onClick={() => fileRef.current?.click()} aria-label="Attach file"',
)
t = t.replace(
  'className="flex min-w-0 flex-1 items-end rounded-full border bg-slate-50 px-3"',
  'className="flex min-w-0 flex-1 items-end rounded-full border border-white/20 bg-white/10 px-3"',
)
t = t.replace(
  'placeholder="Type your message…" className="max-h-24 min-h-[36px] w-full resize-none bg-transparent py-2 text-sm outline-none"',
  'placeholder="Type your message…" className="max-h-24 min-h-[36px] w-full resize-none bg-transparent py-2 text-sm text-white placeholder:text-white/50 outline-none"',
)
p.write_text(t)
print("done", "z-[70]" in t, "border-white/10 bg-[#0b1b3a]" in t)
PY
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add src/routes/student.contact-officer.tsx
          git commit -m "fix(messaging): navy composer + menu z-70 outside close on student contact-officer" || true
          git push
