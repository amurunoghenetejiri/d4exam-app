<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>D4EXAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #0b1b3a;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(1.5rem, env(safe-area-inset-top))
        1.5rem
        max(1.5rem, env(safe-area-inset-bottom));
    }
    .boot-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .boot-main img {
      width: min(40vw, 160px);
      height: min(40vw, 160px);
      object-fit: contain;
    }
    .t {
      margin-top: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
    }
    .t span.b { color: #2563eb; }
    .s {
      margin-top: 0.5rem;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
    }
    .slogan {
      position: absolute;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #94a3b8;
      font-weight: 600;
      padding: 0 2rem;
    }
    .slogan span.hi { color: #60a5fa; }
  </style>
</head>
<body>
  <!--
    Capacitor errorPath. Looks like the normal D4EXAM splash.
    OFFLINE: stay here briefly then load the LOCAL bundled app (index.html).
             Never jump to Vercel — that shows the system "no internet" page
             and forces the user to press Back.
    ONLINE: after splash, open the live app.
    server.url in capacitor.config is never changed by this file.
  -->
  <div class="boot-main">
    <img src="logo.png" alt="" width="160" height="160" onerror="this.style.display='none'" />
    <div class="t">D<span class="b">4</span>EXAM</div>
    <div class="s">Smart Examination System</div>
  </div>
  <div class="slogan">SMART. <span class="hi">SECURE.</span> SEAMLESS.</div>

  <script>
    (function () {
      var LIVE = "https://d4exam-platform.vercel.app/";
      var going = false;

      function offline() {
        try { return navigator.onLine === false; } catch (e) { return false; }
      }

      function goLocal() {
        if (going) return;
        going = true;
        // Local bundled shell (same origin as errorPath) → splash + fingerprint
        var targets = ["index.html", "./index.html", "/index.html"];
        try { window.location.replace(targets[0]); } catch (e) {
          going = false;
          try { window.location.href = targets[1]; } catch (e2) { going = false; }
        }
      }

      function goLive() {
        if (going) return;
        going = true;
        try {
          window.location.replace(LIVE + "?boot=" + Date.now());
        } catch (e) {
          going = false;
        }
      }

      // Always show this splash first (~1.4s), then route.
      setTimeout(function () {
        if (offline()) goLocal();
        else goLive();
      }, 1400);

      window.addEventListener("online", function () {
        going = false;
        goLive();
      });
    })();
  </script>
</body>
</html>
