<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>D4EXAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      min-height: 100dvh;
      background: #0b1b3a;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(1.5rem, env(safe-area-inset-top))
        1.5rem
        max(1.5rem, env(safe-area-inset-bottom));
    }
    .boot-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .boot-main img {
      width: min(40vw, 160px);
      height: min(40vw, 160px);
      object-fit: contain;
    }
    .t {
      margin-top: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
    }
    .t span.b { color: #2563eb; }
    .s {
      margin-top: 0.5rem;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
    }
    .slogan {
      position: absolute;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #94a3b8;
      font-weight: 600;
      padding: 0 2rem;
    }
    .slogan span.hi { color: #60a5fa; }
    /* Soft connecting hint — not a blocking offline screen */
    .hint {
      margin-top: 1.75rem;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.04em;
      min-height: 1.25rem;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .hint.show { opacity: 1; }
    .hint strong { color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>
  <!--
    Capacitor errorPath when live server.url is unreachable.
    MUST look like the normal app splash — never a full "You're Offline" wall on cold start.
    Silently retry loading the live app. Soft hint only after a short wait.
    Online-required actions (start exam, submit, live monitor) still use in-app offline guards.
  -->
  <div class="boot-main">
    <img src="/logo.png" alt="" width="160" height="160" onerror="this.style.display='none'" />
    <div class="t">D<span class="b">4</span>EXAM</div>
    <div class="s">Smart Examination System</div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>
  <div class="slogan">SMART. <span class="hi">SECURE.</span> SEAMLESS.</div>

  <script>
    (function () {
      var LIVE = "https://d4exam-platform.vercel.app/";
      var tries = 0;
      var going = false;
      var hint = document.getElementById("hint");

      function go() {
        if (going) return;
        going = true;
        try {
          window.location.replace(LIVE + "?boot=" + Date.now());
        } catch (e) {
          going = false;
          try { window.location.href = LIVE; } catch (e2) { going = false; }
        }
      }

      function tick() {
        tries += 1;
        // After a few silent retries, show a soft connecting line (still not a full offline page)
        if (tries >= 3 && hint) {
          hint.textContent = "Connecting…";
          hint.classList.add("show");
        }
        if (tries >= 8 && hint) {
          hint.innerHTML = "Waiting for connection… <strong>will open when ready</strong>";
        }
        // Probe: if browser thinks we're online, jump immediately
        try {
          if (navigator.onLine) {
            go();
            return;
          }
        } catch (e) {}
        go(); // always attempt — Capacitor may recover; failed load returns here
      }

      // Immediate + interval retries (normal splash stays visible)
      setTimeout(tick, 200);
      setInterval(function () {
        going = false;
        tick();
      }, 2200);

      window.addEventListener("online", function () {
        if (hint) {
          hint.textContent = "Connected — opening…";
          hint.classList.add("show");
        }
        setTimeout(go, 250);
      });

      // If user taps anywhere, retry
      document.addEventListener("click", function () {
        going = false;
        tick();
      });
    })();
  </script>
</body>
</html>
