<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>D4EXAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      min-height: 100dvh;
      background: #0b1b3a;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(1.5rem, env(safe-area-inset-top))
        1.5rem
        max(1.5rem, env(safe-area-inset-bottom));
    }
    .boot-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .boot-main img {
      width: min(40vw, 160px);
      height: min(40vw, 160px);
      object-fit: contain;
    }
    .t {
      margin-top: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
    }
    .t span.b { color: #2563eb; }
    .s {
      margin-top: 0.5rem;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
    }
    .slogan {
      position: absolute;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: #94a3b8;
      font-weight: 600;
      padding: 0 2rem;
    }
    .slogan span.hi { color: #60a5fa; }
  </style>
</head>
<body>
  <!--
    Capacitor errorPath when live server.url is unreachable.
    Looks exactly like the normal app splash — no "Connecting" / offline wall.
    Silently retries the live app. server.url is never changed.
  -->
  <div class="boot-main">
    <img src="/logo.png" alt="" width="160" height="160" onerror="this.style.display='none'" />
    <div class="t">D<span class="b">4</span>EXAM</div>
    <div class="s">Smart Examination System</div>
  </div>
  <div class="slogan">SMART. <span class="hi">SECURE.</span> SEAMLESS.</div>

  <script>
    (function () {
      var LIVE = "https://d4exam.name.ng/";
      var tries = 0;
      var going = false;

      function go() {
        if (going) return;
        going = true;
        try {
          window.location.replace(LIVE + "?boot=" + Date.now());
        } catch (e) {
          going = false;
          try { window.location.href = LIVE; } catch (e2) { going = false; }
        }
      }

      // Hold normal splash briefly (like online boot), then retry live app silently
      setTimeout(function () {
        go();
      }, 1200);

      setInterval(function () {
        tries += 1;
        going = false;
        go();
      }, 3500);

      window.addEventListener("online", function () {
        going = false;
        go();
      });

      document.addEventListener("click", function () {
        going = false;
        go();
      });
    })();
  </script>
</body>
</html>
